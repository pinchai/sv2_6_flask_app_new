<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>500 - Internal Server Error</title>

    <!-- Bootstrap 4 -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >

    <!-- Font Awesome -->
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    >

    <style>
        body {
            margin: 0;
            font-family: "Source Sans Pro", Arial, sans-serif;
            background: #f4f6f9;
            color: #343a40;
        }

        /* =========================
           Navbar
        ========================== */


        /* =========================
           Sidebar
        ========================== */


        /* =========================
           Main Content
        ========================== */

        .content-wrapper {
            min-height: 100vh;
        }


        .content {
            min-height: 100vh;
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================
           Error Card
        ========================== */

        .error-card {
            max-width: 850px;

            margin: 40px auto;

            background: #ffffff;

            border-top: 3px solid #dc3545;

            border-radius: 3px;

            box-shadow: 0 1px 3px rgba(0, 0, 0, .12);
        }

        .error-body {
            text-align: center;

            padding: 55px 40px;
        }

        /* Icon */

        .error-icon {
            width: 90px;
            height: 90px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #f8d7da;

            color: #721c24;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 40px;
        }

        /* Error Code */

        .error-code {
            font-size: 80px;

            font-weight: 700;

            line-height: 1;

            color: #343a40;

            margin-bottom: 10px;
        }

        /* Title */

        .error-title {
            font-size: 28px;

            font-weight: 400;

            margin-bottom: 12px;
        }

        /* Message */

        .error-message {
            max-width: 600px;

            margin: 0 auto 25px;

            color: #6c757d;

            font-size: 16px;

            line-height: 1.6;
        }

        /* Error Information */

        .error-info {
            display: inline-block;

            background: #f8f9fa;

            border: 1px solid #dee2e6;

            border-radius: 4px;

            padding: 12px 22px;

            margin-bottom: 25px;

            color: #6c757d;

            font-size: 14px;
        }

        .error-info i {
            color: #dc3545;
        }

        /* Buttons */

        .btn-home {
            display: inline-block;

            padding: 9px 20px;

            background: #007bff;

            border: 1px solid #007bff;

            color: #ffffff;

            border-radius: 4px;

            font-size: 14px;

            text-decoration: none;
        }

        .btn-home:hover {
            background: #0069d9;

            border-color: #0062cc;

            color: #ffffff;

            text-decoration: none;
        }

        .btn-retry {
            display: inline-block;

            padding: 9px 20px;

            margin-left: 8px;

            background: #6c757d;

            border: 1px solid #6c757d;

            color: #ffffff;

            border-radius: 4px;

            font-size: 14px;

            text-decoration: none;

            cursor: pointer;
        }

        .btn-retry:hover {
            background: #5a6268;

            border-color: #545b62;

            color: #ffffff;

            text-decoration: none;
        }

        /* =========================
           Footer
        ========================== */


        /* =========================
           Mobile
        ========================== */

        @media (max-width: 768px) {


            .content-wrapper {
                margin-left: 0;
            }


            .content {
                padding: 15px;
            }

            .error-card {
                margin: 20px auto;
            }

            .error-body {
                padding: 40px 20px;
            }

            .error-code {
                font-size: 60px;
            }

            .error-title {
                font-size: 24px;
            }

            .btn-home,
            .btn-retry {
                display: block;

                width: 100%;

                margin: 8px 0;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     Content Wrapper
========================== -->

<div class="content-wrapper">

    <!-- Main Content -->

    <main class="content">

        <div class="error-card">

            <div class="error-body">


                <!-- Error Icon -->

                <div class="error-icon">

                    <i class="fas fa-server"></i>

                </div>


                <!-- Error Code -->

                <div class="error-code">
                    500
                </div>


                <!-- Title -->

                <div class="error-title">
                    Internal Server Error
                </div>


                <!-- Message -->

                <p class="error-message">

                    Something went wrong on our server.

                    We are working to fix the problem.
                    Please try again later.

                </p>


                <!-- Error Information -->

                <div class="error-info">

                    <i class="fas fa-exclamation-circle mr-2"></i>

                    The server encountered an unexpected condition
                    that prevented it from completing your request.

                </div>


                <!-- Actions -->

                <div>

                    <a href="/" class="btn-home">

                        <i class="fas fa-home mr-1"></i>

                        Back to Home

                    </a>


                    <a
                            href="javascript:location.reload()"
                            class="btn-retry"
                    >

                        <i class="fas fa-sync-alt mr-1"></i>

                        Try Again

                    </a>

                </div>

            </div>

        </div>

    </main>

</div>


</body>
</html>
