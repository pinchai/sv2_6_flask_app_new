<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found</title>

    <!-- Bootstrap 4 -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >

    <!-- Font Awesome -->
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    >

    <style>
        body {
            margin: 0;
            font-family: "Source Sans Pro", Arial, sans-serif;
            background: #f4f6f9;
            color: #343a40;
        }

        /* =========================
           Navbar
        ========================= */

        .main-header {
            height: 57px;
            background: #ffffff;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
        }

        .navbar-brand {
            color: #343a40;
            font-size: 20px;
            text-decoration: none;
        }

        .navbar-brand:hover {
            color: #007bff;
            text-decoration: none;
        }

        /* =========================
           Sidebar
        ========================= */

        .brand-link {
            height: 57px;

            display: flex;
            align-items: center;

            padding: 0 15px;

            background: #343a40;
            color: #ffffff;

            font-size: 20px;
            font-weight: 600;

            text-decoration: none;

            border-bottom: 1px solid rgba(255, 255, 255, .1);
        }

        .brand-link:hover {
            color: #ffffff;
            text-decoration: none;
        }

        .brand-link i {
            margin-right: 10px;
        }

        .brand-link span {
            font-weight: 300;
        }

        .sidebar {
            padding: 15px 10px;
        }

        .user-panel {
            display: flex;
            align-items: center;

            padding: 10px 5px 20px;

            border-bottom: 1px solid rgba(255, 255, 255, .1);

            margin-bottom: 15px;
        }

        .user-avatar {
            width: 35px;
            height: 35px;

            border-radius: 50%;

            background: #6c757d;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 10px;
        }

        .user-name {
            font-size: 14px;
        }

        .nav-title {
            color: #adb5bd;

            font-size: 11px;

            text-transform: uppercase;

            padding: 8px 10px;
        }

        .nav-item {
            margin-bottom: 3px;
        }

        .nav-link {
            display: block;

            padding: 10px 12px;

            color: #c2c7d0;

            border-radius: 4px;

            font-size: 14px;

            text-decoration: none;
        }

        .nav-link:hover {
            background: #495057;
            color: #ffffff;
            text-decoration: none;
        }

        .nav-link.active {
            background: #007bff;
            color: #ffffff;
        }

        .nav-link i {
            width: 25px;
        }

        /* =========================
           Main Content
        ========================= */

        .content-wrapper {
            min-height: 100vh;
        }

        .content-header {
            background: #ffffff;

            padding: 15px 25px;

            border-bottom: 1px solid #dee2e6;
        }

        .content-header h1 {
            font-size: 24px;
            font-weight: 400;

            margin: 0;
        }

        .breadcrumb {
            background: transparent;

            padding: 5px 0 0;
            margin: 0;

            font-size: 13px;
        }

        .content {
            min-height: 100vh;
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================
           404 Card
        ========================= */

        .error-card {
            max-width: 850px;

            margin: 40px auto;

            background: #ffffff;

            border-top: 3px solid #dc3545;

            border-radius: 3px;

            box-shadow: 0 1px 3px rgba(0, 0, 0, .12);
        }

        .error-body {
            text-align: center;

            padding: 55px 40px;
        }

        /* Icon */

        .error-icon {
            width: 90px;
            height: 90px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #f8d7da;

            color: #721c24;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;
        }

        /* Error Number */

        .error-code {
            font-size: 80px;

            font-weight: 700;

            line-height: 1;

            color: #343a40;

            margin-bottom: 10px;
        }

        /* Title */

        .error-title {
            font-size: 28px;

            font-weight: 400;

            margin-bottom: 12px;
        }

        /* Message */

        .error-message {
            max-width: 600px;

            margin: 0 auto 25px;

            color: #6c757d;

            font-size: 16px;

            line-height: 1.6;
        }

        /* URL box */

        .requested-url {
            display: inline-block;

            background: #f8f9fa;

            border: 1px solid #dee2e6;

            border-radius: 4px;

            padding: 10px 18px;

            margin-bottom: 25px;

            color: #6c757d;

            font-size: 14px;
        }

        .requested-url i {
            color: #dc3545;
        }

        /* Buttons */

        .btn-home {
            display: inline-block;

            padding: 9px 20px;

            background: #007bff;

            border: 1px solid #007bff;

            color: #ffffff;

            border-radius: 4px;

            font-size: 14px;

            text-decoration: none;
        }

        .btn-home:hover {
            background: #0069d9;

            border-color: #0062cc;

            color: #ffffff;

            text-decoration: none;
        }

        .btn-back {
            display: inline-block;

            padding: 9px 20px;

            margin-left: 8px;

            background: #6c757d;

            border: 1px solid #6c757d;

            color: #ffffff;

            border-radius: 4px;

            font-size: 14px;

            text-decoration: none;
        }

        .btn-back:hover {
            background: #5a6268;

            border-color: #545b62;

            color: #ffffff;

            text-decoration: none;
        }

        /* =========================
           Footer
        ========================= */

        /* =========================
           Mobile
        ========================= */

        @media (max-width: 768px) {

            .content-wrapper {
                margin-left: 0;
            }

            .content {
                padding: 15px;
            }

            .error-card {
                margin: 20px auto;
            }

            .error-body {
                padding: 40px 20px;
            }

            .error-code {
                font-size: 60px;
            }

            .error-title {
                font-size: 24px;
            }

            .btn-home,
            .btn-back {
                display: block;

                width: 100%;

                margin: 8px 0;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     Main Wrapper
========================== -->

<div class="content-wrapper">

    <!-- Content -->

    <main class="content">

        <div class="error-card">

            <div class="error-body">

                <!-- Icon -->

                <div class="error-icon">

                    <i class="fas fa-map-signs"></i>

                </div>


                <!-- Error Code -->

                <div class="error-code">
                    404
                </div>


                <!-- Title -->

                <div class="error-title">
                    Page Not Found
                </div>


                <!-- Message -->

                <p class="error-message">

                    Sorry, the page you are looking for
                    could not be found.

                    The page may have been removed,
                    renamed, or the URL may be incorrect.

                </p>


                <!-- Requested URL -->

                <div class="requested-url">

                    <i class="fas fa-link mr-2"></i>

                    Requested page:
                    <strong id="current-url"></strong>

                </div>


                <!-- Actions -->

                <div>

                    <a href="/" class="btn-home">

                        <i class="fas fa-home mr-1"></i>

                        Back to Home

                    </a>


                    <a
                            href="javascript:history.back()"
                            class="btn-back"
                    >

                        <i class="fas fa-arrow-left mr-1"></i>

                        Go Back

                    </a>

                </div>

            </div>

        </div>

    </main>

</div>


<!-- Current URL -->

<script>
    document.getElementById("current-url").textContent =
        window.location.pathname;
</script>

</body>
</html>
