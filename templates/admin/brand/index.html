{% extends 'admin/master.html' %}

{% block content %}
    <main class="app-main">

        <div class="app-content-header">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-sm-6">
                        <h3 class="mb-0">Brands List</h3>
                    </div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-end">
                            <li class="breadcrumb-item"><a href="{{ url_for('admin_bp.dashboard') }}">Home</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Brands</li>
                        </ol>
                    </div>
                </div>
            </div>
        </div>

        <div class="app-content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-lg-12 col-12">
                        <div class="card">
                            <div class="card-header">
                                <a href="{{ url_for('admin_bp.add_brand') }}" class="btn btn-primary">
                                    <i class="bi bi-plus-circle"></i>
                                    Add New Brand
                                </a>
                            </div>
                            <div class="card-body">
                                <table id="brandTable" class="table table-striped table-bordered" style="width:100%">
                                    <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Image</th>
                                        <th>Name</th>
                                        <th>Description</th>
                                        <th>Actions</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    {% for brand in brands %}
                                        <tr>
                                            <td>{{ brand.id }}</td>
                                            <td>
                                                <img
                                                        src="{{ url_for('static', filename='images/' + (brand.image or '')) }}"
                                                        alt=""
                                                        style="width: 50px; height: 50px; object-fit: contain; border-radius: 8px;"
                                                        onerror="this.src='{{ url_for('static', filename='admin/image/no_image.png') }}';"
                                                >
                                            </td>
                                            <td>{{ brand.name }}</td>
                                            <td>{{ brand.description or '' }}</td>
                                            <td>
                                                <a href="{{ url_for('admin_bp.edit_brand', brand_id=brand.id) }}"
                                                   class="btn btn-sm btn-primary">
                                                    <i class="bi bi-pencil-square"></i>
                                                    Edit
                                                </a>
                                                <a href="{{ url_for('admin_bp.confirm_delete_brand', brand_id=brand.id) }}"
                                                   class="btn btn-sm btn-danger">
                                                    <i class="bi bi-trash3"></i>
                                                    Delete
                                                </a>
                                            </td>
                                        </tr>
                                    {% endfor %}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
{% endblock %}
