{% extends 'admin/master.html' %}

{% block content %}
    <main class="app-main">

        <div class="app-content-header">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-sm-6">
                        <h3 class="mb-0">Add New Category</h3>
                    </div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-end">
                            <li class="breadcrumb-item"><a href="{{ url_for('admin_bp.dashboard') }}">Home</a></li>
                            <li class="breadcrumb-item"><a href="{{ url_for('admin_bp.category') }}">Categories</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Add</li>
                        </ol>
                    </div>
                </div>
            </div>
        </div>

        <div class="app-content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-lg-12 col-12">
                        <div class="card">
                            <div class="card-header">
                                <a href="{{ url_for('admin_bp.category') }}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i>
                                    Back
                                </a>
                            </div>
                            <div class="card-body">
                                <form
                                        action="{{ url_for('admin_bp.do_add_category') }}"
                                        method="POST"
                                        enctype="multipart/form-data"
                                >
                                    <!-- CSRF token -->
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                                    <div class="form-group mb-3">
                                        <img
                                                src="{{ url_for('static', filename='admin/image/no_image.png') }}"
                                                alt="Category Image"
                                                id="image_preview"
                                                style="width: 100px; height: 100px; object-fit: contain;"
                                        >
                                        <input
                                                type="file"
                                                class="form-control mt-2"
                                                id="image"
                                                name="image"
                                                accept="image/*"
                                                onchange="loadFile(event)"
                                        >
                                    </div>
                                    <hr>
                                    <div class="form-group mb-3">
                                        <label for="name">Category Name</label>
                                        <input type="text" class="form-control" id="name" name="name" required>
                                    </div>
                                    <div class="form-group mb-3">
                                        <label for="description">Description</label>
                                        <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                                    </div>
                                    <hr>
                                    <button type="submit" class="btn btn-primary float-end">
                                        <i class="bi bi-floppy"></i>
                                        Save Category
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
{% endblock %}

{% block script %}
    <script>
        var loadFile = function (event) {
            if (event.target.files && event.target.files[0]) {
                var output = document.getElementById('image_preview');
                output.src = URL.createObjectURL(event.target.files[0]);
                output.onload = function () {
                    URL.revokeObjectURL(output.src); // free memory
                }
            }
        };
    </script>
{% endblock %}
