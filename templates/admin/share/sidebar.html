<aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
    <div class="sidebar-brand">
        <a href="{{ url_for('admin_bp.dashboard') }}" class="brand-link">
            <img
                    src="{{ url_for('static', filename='admin/image/logo.png') }}"
                    alt="AdminLTE Logo"
                    class="brand-image opacity-75 shadow"
            />
            <span class="brand-text fw-light">AdminLTE 4</span>
        </a>
    </div>
    <div class="sidebar-wrapper">
        <nav class="mt-2">
            <ul
                    class="nav sidebar-menu flex-column"
                    role="navigation"
                    aria-label="Main navigation"
                    id="navigation"
            >
                {# dashboard #}
                <li class="nav-item">
                    <a href="{{ url_for('admin_bp.dashboard') }}" class="nav-link {{ 'active' if module == 'dashboard' else '' }}">
                        <i class="nav-icon bi bi-house"></i>
                        <p>Dashboard</p>
                    </a>
                </li>

                {# user #}
                <li class="nav-item">
                    <a href="{{ url_for('admin_bp.user') }}" class="nav-link {{ 'active' if module == 'user' else '' }}">

                {# brand #}
                <li class="nav-item">
                    <a href="{{ url_for('admin_bp.brand') }}" class="nav-link {{ 'active' if module == 'brand' else '' }}">

                    </a>
                </li>

                {# category #}
                <li class="nav-item">
                    <a href="{{ url_for('admin_bp.category') }}" class="nav-link {{ 'active' if module == 'category' else '' }}">
                        <i class="nav-icon bi bi-tags"></i>
                        <p>Category</p>
                    </a>
                </li>

                {# product #}
                <li class="nav-item">
                    <a href="{{ url_for('admin_bp.product') }}" class="nav-link {{ 'active' if module == 'product' else '' }}">
                        <i class="nav-icon bi bi-box-seam"></i>
                        <p>Product</p>
                    </a>
                </li>

            </ul>
        </nav>
    </div>
</aside>
